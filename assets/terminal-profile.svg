<text x="414" y="83" class="mono teal" font-size="12">$ whoami</text>
<text x="414" y="107" class="ui white" font-size="22" font-weight="700">Mohamed Ahmed Abdo</text>
<text x="414" y="128" class="ui muted" font-size="14">Junior DevOps &amp; Cloud Engineer</text>
