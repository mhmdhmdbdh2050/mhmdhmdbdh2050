<text x="414" y="362" class="mono white" font-size="12">Build → Test → Document → Improve</text>
<rect x="952" y="350" width="7" height="15" rx="1" fill="#2DD4BF"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
