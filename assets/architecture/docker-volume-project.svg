<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
<title id="title">Docker Volume Project</title><desc id="desc">One container writes file.txt to a named Docker volume and another container reads it from the same volume.</desc>
<rect width="1100" height="230" rx="20" fill="#0b1220"/><text x="36" y="43" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="700">DOCKER VOLUME PROJECT</text><text x="36" y="69" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Named volume keeps the file independent of either container lifecycle</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#12243a" stroke="#38bdf8" stroke-width="2"><rect x="55" y="105" width="230" height="76" rx="12"/><rect x="420" y="105" width="260" height="76" rx="12"/><rect x="815" y="105" width="230" height="76" rx="12"/></g><g fill="#f8fafc" font-size="17" font-weight="700"><text x="170" y="137">Container 1</text><text x="170" y="161">writes file.txt</text><text x="550" y="137">Named volume</text><text x="550" y="161">my-volume</text><text x="930" y="137">Container 2</text><text x="930" y="161">reads file.txt</text></g></g><g stroke="#5eead4" stroke-width="3" fill="none"><path d="M285 143h125m270 0h135"/></g><g fill="#5eead4"><path d="m410 137 12 6-12 6zm-113 0-12 6 12 6zm258 0 12 6-12 6zm123 0-12 6 12 6z"/></g>
</svg>
