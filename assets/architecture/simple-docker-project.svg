<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
<title id="title">Simple Docker Project</title><desc id="desc">Compose starts an Nginx container mapping host port 8081 to port 80 and mounts the local html directory as the website document root.</desc>
<rect width="1100" height="230" rx="20" fill="#0b1220"/><text x="36" y="43" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="700">SIMPLE DOCKER PROJECT</text><text x="36" y="69" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Compose service · Nginx image · bind-mounted static site</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#12243a" stroke="#38bdf8" stroke-width="2"><rect x="55" y="105" width="210" height="76" rx="12"/><rect x="405" y="105" width="290" height="76" rx="12"/><rect x="835" y="105" width="220" height="76" rx="12"/></g><g fill="#f8fafc" font-size="17" font-weight="700"><text x="160" y="137">Browser</text><text x="160" y="161">host :8081</text><text x="550" y="137">Nginx container :80</text><text x="550" y="161">Compose service web</text><text x="945" y="137">./html</text><text x="945" y="161">index.html + style.css</text></g></g><g stroke="#5eead4" stroke-width="3" fill="none"><path d="M265 143h130m300 0h130"/></g><g fill="#5eead4"><path d="m395 137 12 6-12 6zm-118 0-12 6 12 6zm288 0 12 6-12 6zm118 0-12 6 12 6z"/></g>
</svg>
