<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
<title id="title">Docker Custom Image Project</title><desc id="desc">A custom Docker image copies an HTML file into Nginx, which serves it on container port 80 mapped to host port 8082.</desc>
<rect width="1100" height="230" rx="20" fill="#0b1220"/><text x="36" y="43" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="700">DOCKER CUSTOM IMAGE PROJECT</text><text x="36" y="69" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Dockerfile: nginx:alpine + COPY index.html into the image</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#12243a" stroke="#38bdf8" stroke-width="2"><rect x="55" y="105" width="190" height="75" rx="12"/><rect x="355" y="105" width="250" height="75" rx="12"/><rect x="715" y="105" width="310" height="75" rx="12"/></g><g fill="#f8fafc" font-size="17" font-weight="700"><text x="150" y="137">index.html</text><text x="150" y="160">build input</text><text x="480" y="137">Custom Nginx image</text><text x="480" y="160">serves copied page</text><text x="870" y="137">Browser → host :8082</text><text x="870" y="160">→ container :80</text></g></g><g stroke="#5eead4" stroke-width="3" fill="none"><path d="M245 143h100m260 0h100"/></g><g fill="#5eead4"><path d="m345 137 12 6-12 6zm248 0 12 6-12 6z"/></g>
</svg>
