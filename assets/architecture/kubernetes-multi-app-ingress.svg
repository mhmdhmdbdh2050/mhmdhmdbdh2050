<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes Multi-App Ingress Lab</title><desc id="desc">An externally configured AWS load balancer reaches the NGINX Ingress controller, which routes three URL paths to Kubernetes services and app deployments.</desc>
<rect width="1100" height="300" rx="20" fill="#0b1220"/><text x="36" y="43" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="700">KUBERNETES MULTI-APP INGRESS LAB</text><text x="36" y="69" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Ingress and app Services are in the manifests; AWS load balancer / EC2 are external setup</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#12243a" stroke="#38bdf8" stroke-width="2"><rect x="28" y="111" width="150" height="65" rx="11"/><rect x="230" y="111" width="165" height="65" rx="11"/><rect x="450" y="111" width="180" height="65" rx="11"/><rect x="755" y="91" width="285" height="55" rx="10"/><rect x="755" y="157" width="285" height="55" rx="10"/><rect x="755" y="223" width="285" height="55" rx="10"/></g><g fill="#f8fafc" font-size="16" font-weight="700"><text x="103" y="139">External AWS ALB</text><text x="103" y="160">HTTP :80</text><text x="312" y="139">Worker node</text><text x="312" y="160">NodePort :30491</text><text x="540" y="150">NGINX Ingress</text><text x="897" y="115">/mohamed → app1-svc :2000 → app1</text><text x="897" y="181">/app2 → app2-svc :2500 → app2</text><text x="897" y="247">/tala → app3-service :9000 → app3</text></g></g><g stroke="#5eead4" stroke-width="3" fill="none"><path d="M178 143h44m173 0h49m180 0h84v-25h37m-37 25v38h37m-37-38v104h37"/></g><g fill="#5eead4"><path d="m222 137 12 6-12 6zm49 0 12 6-12 6zm237 0 12 6-12 6zm0-25 12 6-12 6zm0 38 12 6-12 6zm0 98 12 6-12 6z"/></g>
