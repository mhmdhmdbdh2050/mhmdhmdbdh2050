<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="title desc">
<title id="title">WordPress Compose Stack</title><desc id="desc">Nginx publishes port 8089 and forwards requests to WordPress, which connects to MariaDB. WordPress and database data use persistent volumes; phpMyAdmin is optional.</desc>
<rect width="1100" height="280" rx="20" fill="#0b1220"/><text x="36" y="43" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="700">WORDPRESS COMPOSE STACK</text><text x="36" y="69" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Compose network · persistent database and WordPress files · optional tools profile</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#12243a" stroke="#38bdf8" stroke-width="2"><rect x="42" y="105" width="160" height="76" rx="11"/><rect x="290" y="105" width="170" height="76" rx="11"/><rect x="550" y="105" width="180" height="76" rx="11"/><rect x="820" y="105" width="190" height="76" rx="11"/><rect x="550" y="205" width="180" height="55" rx="11" stroke-dasharray="6 5"/></g><g fill="#f8fafc" font-size="17" font-weight="700"><text x="122" y="138">Browser</text><text x="122" y="163">host :8089</text><text x="375" y="138">Nginx :80</text><text x="640" y="138">WordPress / PHP</text><text x="640" y="162">FPM :9000</text><text x="915" y="138">MariaDB :3306</text><text x="915" y="162">db_data volume</text><text x="640" y="238">phpMyAdmin (optional)</text></g><g fill="#94a3b8" font-size="13"><text x="375" y="168">wordpress_data + uploads</text></g></g><g stroke="#5eead4" stroke-width="3" fill="none"><path d="M202 143h78m180 0h82m180 0h88M730 232h130v-51"/></g><g fill="#5eead4"><path d="m280 137 12 6-12 6zm82 0 12 6-12 6zm180 0 12 6-12 6zm302-57 6-12 6 12z"/></g>
</svg>
